<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuizCraft 💗</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;background:radial-gradient(circle at top,#ffdff0,#f4b4d6 45%,#a96cff);color:#3b1730;padding:16px}
.card{max-width:520px;margin:20px auto;padding:25px 19px;border-radius:30px;background:#fffffff0;box-shadow:0 22px 70px #6d245555}
h1{text-align:center}.sub{text-align:center;opacity:.7;line-height:1.5}.hidden{display:none!important}
input,textarea{width:100%;padding:13px;border:1px solid #ead0df;border-radius:14px;font:inherit;margin:6px 0}
textarea{min-height:75px}.btn{width:100%;border:0;border-radius:999px;padding:14px;margin-top:10px;font-size:16px;font-weight:750;cursor:pointer;background:#ff4f9a;color:white}
.dark{background:#3b1730}.light{background:#fff0f7;color:#54213f}.q{padding:15px;border-radius:20px;background:#fff7fb;margin:14px 0}
.opt{display:flex;gap:7px;align-items:center}.mini{border:0;border-radius:10px;padding:8px;margin-top:5px}.ans{background:#fff0f7;border-radius:17px;padding:14px;margin:10px 0}
.status{text-align:center;font-size:13px;opacity:.7;margin-top:10px}.error{color:#b00020;text-align:center;font-size:14px;margin-top:8px}
</style>
</head>
<body>
<div class="card">

<section id="home">
  <div style="font-size:55px;text-align:center">💗</div>
  <h1>QuizCraft</h1>
  <p class="sub">Create a custom quiz and share it with anyone.</p>
  <button class="btn" data-action="startCreate">Create My Quiz ✨</button>
  <button class="btn dark" data-action="openResponses">My Responses 👀</button>
  <button class="btn light" data-action="show" data-target="login">Owner Login 🔐</button>
  <div id="homeStatus" class="status"></div>
</section>

<section id="login" class="hidden">
  <h1>Owner Login 🔐</h1>
  <p class="sub">Use the email and password you created in Supabase.</p>
  <input id="loginEmail" type="email" placeholder="Your email">
  <input id="loginPassword" type="password" placeholder="Your password">
  <button class="btn" data-action="login">Login</button>
  <button class="btn light" data-action="show" data-target="home">Back</button>
  <div id="loginMsg" class="error"></div>
</section>

<section id="maker" class="hidden">
  <h1>Make Your Quiz</h1>
  <input id="title" placeholder="Quiz title">
  <div id="qs"></div>
  <button class="btn light" data-action="addQ">+ Add Question</button>
  <button class="btn" data-action="makeLink">Generate Share Link 🔗</button>
  <button class="btn dark" data-action="show" data-target="home">Back</button>
  <div id="makerMsg" class="error"></div>
</section>

<section id="share" class="hidden">
  <h1>Quiz Ready 🎉</h1>
  <p class="sub">Copy this link and send it to your friend.</p>
  <textarea id="link" readonly></textarea>
  <button class="btn" data-action="copyLink">Copy Link 📋</button>
  <button class="btn light" data-action="preview">Preview</button>
  <button class="btn dark" data-action="show" data-target="maker">Back</button>
</section>

<section id="quiz" class="hidden">
  <div style="font-size:48px;text-align:center">💗</div>
  <h1 id="qt"></h1>
  <p class="sub">Pehle apna naam batao.</p>
  <input id="name" placeholder="Your name">
  <div id="qb"></div>
  <button class="btn" data-action="submitQuiz">Submit Answers 💗</button>
  <div id="submitMsg" class="error"></div>
</section>

<section id="done" class="hidden">
  <div style="font-size:55px;text-align:center">🎉</div>
  <h1>Answer Submitted!</h1>
  <p class="sub">Thanks! Your answers were saved.</p>
</section>

<section id="resp" class="hidden">
  <h1>Responses 👀</h1>
  <div id="rl"></div>
  <button class="btn light" data-action="exportR">Export</button>
  <button class="btn dark" data-action="show" data-target="home">Back</button>
</section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.addEventListener('error',e=>{const x=document.getElementById('homeStatus');if(x)x.textContent='JavaScript error: '+e.message;});</script>
<script>
(function(){
'use strict';
const SUPABASE_URL='https://rzbcofckfgnurhnxmgbl.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_WPGUUlCUn52sH3rvaYoAgg_MCIeDkYZ';
let supabase=null, active=null, activeQuizId=null;
const $=id=>document.getElementById(id);

function show(x){
  document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));
  const el=$(x); if(el) el.classList.remove('hidden');
}
function status(msg){ const x=$('homeStatus'); if(x) x.textContent=msg||''; }

window.addEventListener('error',e=>{status('JavaScript error: '+(e.message||'Unknown error'));});

function setReady(){
  document.querySelectorAll('[data-action]').forEach(btn=>{
    if(btn.dataset.bound) return;
    btn.dataset.bound='1';
    btn.addEventListener('click', async function(ev){
      ev.preventDefault();
      const a=this.dataset.action;
      try{
        if(a==='show') show(this.dataset.target);
        else if(a==='startCreate') await startCreate();
        else if(a==='openResponses') await openResponses();
        else if(a==='login') await login();
        else if(a==='addQ') addQ();
        else if(a==='makeLink') await makeLink();
        else if(a==='copyLink') await copyLink();
        else if(a==='preview') renderQuiz(active);
        else if(a==='submitQuiz') await submitQuiz();
        else if(a==='exportR') exportR();
      }catch(err){
        status('Error: '+(err?.message||err));
        console.error(err);
      }
    });
  });
}

async function init(){
  setReady();
  try{
    if(!window.supabase){ status('Supabase load nahi hua. Internet on karke reload karo.'); return; }
    supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
    await updateHomeStatus();
  }catch(e){ status('Connection error: '+e.message); }
  loadSharedQuiz();
}

async function updateHomeStatus(){
  if(!supabase){status('Supabase load nahi hua. Internet on karke reload karo.');return;}
  const {data,error}=await supabase.auth.getSession();
  if(error){status('Connection error: '+error.message);return;}
  status(data.session ? 'Logged in as '+(data.session.user.email||'owner') : 'Not logged in');
}

async function startCreate(){
  if(!supabase){show('login');$('loginMsg').textContent='Internet on karke page reload karo.';return;}
  const {data,error}=await supabase.auth.getSession();
  if(error){$('loginMsg').textContent=error.message;show('login');return;}
  if(!data.session){show('login');return;}
  newQuiz();
}

async function login(){
  if(!supabase){$('loginMsg').textContent='Supabase load nahi hua. Internet on karke reload karo.';return;}
  const email=$('loginEmail').value.trim(), password=$('loginPassword').value;
  $('loginMsg').textContent='';
  if(!email||!password){$('loginMsg').textContent='Email aur password dono bharo.';return;}
  const {error}=await supabase.auth.signInWithPassword({email,password});
  if(error){$('loginMsg').textContent=error.message;return;}
  await updateHomeStatus(); show('home');
}

function addQ(data){
  const d=document.createElement('div'); d.className='q';
  d.innerHTML='<input class="qtext" placeholder="Question"><div class="opts"></div><button class="mini light add" type="button">+ Option</button> <button class="mini rem" type="button">Remove</button>';
  if(data) d.querySelector('.qtext').value=data.text||'';
  const o=d.querySelector('.opts'); (data?.options||['YES 😈','NO 😭']).forEach(v=>addO(o,v));
  d.querySelector('.add').addEventListener('click',()=>addO(o,''));
  d.querySelector('.rem').addEventListener('click',()=>d.remove());
  $('qs').appendChild(d);
}
function addO(p,v){
  const d=document.createElement('div'); d.className='opt';
  d.innerHTML='<input class="oval" placeholder="Answer option"><button class="mini" type="button">×</button>';
  d.querySelector('.oval').value=v||'';
  d.querySelector('button').addEventListener('click',()=>d.remove());
  p.appendChild(d);
}
function newQuiz(){
  $('title').value='Do You Hate Me? 💗'; $('qs').innerHTML=''; $('makerMsg').textContent='';
  addQ(); addQ({text:'How much do you like talking to me?',options:['A little 😌','A lot 🫶','More than I admit 👀']}); show('maker');
}
function collect(){
  return {title:$('title').value.trim()||'My Quiz 💗',questions:[...document.querySelectorAll('.q')].map(d=>({text:d.querySelector('.qtext').value.trim(),options:[...d.querySelectorAll('.oval')].map(x=>x.value.trim()).filter(Boolean)})).filter(x=>x.text&&x.options.length>=2)};
}
function enc(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function dec(x){try{return JSON.parse(decodeURIComponent(escape(atob(x.replace(/-/g,'+').replace(/_/g,'/')))))}catch(e){return null}}
function makeId(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12)}

async function makeLink(){
  const q=collect();
  if(!q.questions.length){$('makerMsg').textContent='At least one question with two options add karo.';return;}
  if(!supabase){$('makerMsg').textContent='Supabase load nahi hua. Internet on karke reload karo.';return;}
  const {data:{session},error:se}=await supabase.auth.getSession();
  if(se||!session){show('login');$('loginMsg').textContent=se?.message||'Pehle login karo.';return;}
  const id=makeId();
  const {error}=await supabase.from('quizzes').insert({id,owner_id:session.user.id,title:q.title});
  if(error){$('makerMsg').textContent='Quiz save nahi hua: '+error.message;return;}
  active=q; activeQuizId=id;
  $('link').value=location.href.split('#')[0]+'#quiz='+encodeURIComponent(id)+'&data='+enc(q);
  show('share');
}

async function copyLink(){
  try{await navigator.clipboard.writeText($('link').value); alert('Link copied!');}
  catch(e){$('link').focus();$('link').select();document.execCommand('copy');alert('Link copied!');}
}
function renderQuiz(q){
  if(!q)return;
  active=q; $('qt').textContent=q.title||'Quiz';
  $('name').value=''; $('submitMsg').textContent='';
  $('qb').innerHTML=q.questions.map((x,i)=>'<div class="q"><b>'+(i+1)+'. '+esc(x.text)+'</b>'+x.options.map(o=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+escAttr(o)+'"> '+esc(o)+'</label>').join('')+'</div>').join('');
  show('quiz');
}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function escAttr(v){return esc(v);}

async function submitQuiz(){
  $('submitMsg').textContent=''; const n=$('name').value.trim();
  if(!n){$('submitMsg').textContent='Pehle naam likho.';return;}
  if(!activeQuizId){$('submitMsg').textContent='Quiz link invalid hai.';return;}
  if(!supabase){$('submitMsg').textContent='Internet/Supabase connection nahi hai.';return;}
  const answers=active.questions.map((q,i)=>({question:q.text,answer:document.querySelector('input[name=q'+i+']:checked')?.value||'Not answered'}));
  const {error}=await supabase.from('responses').insert({quiz_id:activeQuizId,name:n,answers});
  if(error){$('submitMsg').textContent='Submit nahi hua: '+error.message;return;}
  show('done');
}

async function openResponses(){
  if(!supabase){show('login');$('loginMsg').textContent='Internet on karke page reload karo.';return;}
  const {data:{session},error:se}=await supabase.auth.getSession();
  if(se){$('loginMsg').textContent=se.message;show('login');return;}
  if(!session){show('login');return;}
  const {data:quizzes,error:qerr}=await supabase.from('quizzes').select('id,title').eq('owner_id',session.user.id);
  if(qerr){alert(qerr.message);return;}
  if(!quizzes?.length){$('rl').innerHTML='<p class="sub">Abhi koi quiz nahi hai.</p>';show('resp');return;}
  const ids=quizzes.map(q=>q.id);
  const {data:rows,error:rerr}=await supabase.from('responses').select('name,quiz_id,answers,created_at').in('quiz_id',ids).order('created_at',{ascending:false});
  if(rerr){alert(rerr.message);return;}
  $('rl').innerHTML=rows?.length?rows.map(x=>{const quiz=quizzes.find(q=>q.id===x.quiz_id);const answers=Array.isArray(x.answers)?x.answers:[];return '<div class="ans"><b>👤 '+esc(x.name)+'</b><br><small>'+esc(quiz?.title||'Quiz')+'</small><br>'+answers.map((a,i)=>(i+1)+'. '+esc(a.question)+'<br><b>'+esc(a.answer)+'</b>').join('<br><br>')+'</div>'}).join(''):'<p class="sub">No responses yet.</p>';
  show('resp');
}
function exportR(){alert('Export abhi next update me add karenge.');}
function loadSharedQuiz(){
  const hash=location.hash; if(!hash.startsWith('#quiz='))return;
  const raw=hash.slice(6), split=raw.split('&data='), id=decodeURIComponent(split[0]), q=split[1]?dec(split[1]):null;
  if(id&&q?.questions?.length){activeQuizId=id;renderQuiz(q);}
}

// Expose only for compatibility; buttons themselves use addEventListener.
Object.assign(window,{show,startCreate,openResponses,login,addQ,makeLink,copyLink,submitQuiz,exportR});
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();
</script>
</body>
</html>
